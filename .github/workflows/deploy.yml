name: Deploy to Azure

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Azure Login using OIDC
        uses: azure/login@v3
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        env:
          VITE_RECIPIENT_NAME_YOU: ${{ vars.RECIPIENT_NAME_YOU }}
          VITE_RECIPIENT_NAME_PARTNER: ${{ vars.RECIPIENT_NAME_PARTNER }}
          VITE_RECIPIENT_NAME_BABY: ${{ vars.RECIPIENT_NAME_BABY }}
        run: npm run build

      - name: Install production dependencies
        working-directory: ./server/deploy
        run: npm install --production

      - name: Deploy server to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || 'bwwt-app' }}
          package: ./server/deploy

      - name: Run database migrations
        working-directory: ./server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          if [ -n "$DATABASE_URL" ]; then
            npx prisma migrate deploy
          else
            echo "DATABASE_URL not set, skipping migrations"
          fi
        continue-on-error: true

      - name: Purge Front Door cache
        if: success()
        continue-on-error: true
        timeout-minutes: 1
        run: |
          # Purge cache without waiting for completion (--no-wait)
          az afd endpoint purge \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP || 'bwwt-rg' }} \
            --profile-name ${{ vars.AZURE_FRONTDOOR_PROFILE || 'bwwt-fd' }} \
            --endpoint-name ${{ vars.AZURE_FRONTDOOR_ENDPOINT || 'bwwt-endpoint' }} \
            --content-paths "/*" \
            --no-wait || echo "Cache purge skipped (Front Door may not be configured)"

      - name: Azure Logout
        run: az logout
        if: always()
