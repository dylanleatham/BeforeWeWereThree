name: Deploy to Azure

on:
  push:
    branches:
      - main

permissions:
  id-token: write
  contents: read

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Azure Login using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Deploy server to Azure App Service
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ vars.AZURE_WEBAPP_NAME || 'bwwt-app' }}
          package: ./server

      - name: Run database migrations
        run: |
          # Migrations run on App Service using Key Vault secrets
          # This uses Azure CLI to execute the postdeploy script remotely
          az webapp ssh --name ${{ vars.AZURE_WEBAPP_NAME || 'bwwt-app' }} \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP || 'bwwt-rg' }} \
            --command "cd /home/site/wwwroot && npm run db:deploy" \
            --timeout 120 || echo "Migration step skipped (App Service SSH may not be available yet)"
        continue-on-error: true

      - name: Purge Front Door cache
        if: success()
        continue-on-error: true
        timeout-minutes: 2
        run: |
          # Check if Front Door exists before attempting purge
          if az afd profile show \
            --resource-group ${{ vars.AZURE_RESOURCE_GROUP || 'bwwt-rg' }} \
            --profile-name ${{ vars.AZURE_FRONTDOOR_PROFILE || 'bwwt-fd' }} \
            --query "name" -o tsv 2>/dev/null; then
            echo "Front Door found, purging cache..."
            az afd endpoint purge \
              --resource-group ${{ vars.AZURE_RESOURCE_GROUP || 'bwwt-rg' }} \
              --profile-name ${{ vars.AZURE_FRONTDOOR_PROFILE || 'bwwt-fd' }} \
              --endpoint-name ${{ vars.AZURE_FRONTDOOR_ENDPOINT || 'bwwt-endpoint' }} \
              --content-paths "/*"
          else
            echo "Front Door not configured yet, skipping cache purge"
          fi

      - name: Azure Logout
        run: az logout
        if: always()
